<div *ngIf="quotes$ | async as quotes; else noQuotes" class="quotes-container" [@fadeInContainer]>
  <!-- Filter Section -->
  <div class="search-bar">
    <div class="input-container">
      <input
        type="text"
        placeholder="Enter tag"
        [formControl]="requestForm.controls.tag">
      <mat-icon class="search-icon">search</mat-icon>
    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="onTagSearch()"
      [disabled]="(loading$ | async)"
      class="search-btn">
      Search
    </button>
  </div>


  <!-- Quotes Grid -->
  <div class="quotes-grid">
    <app-quote-card
      *ngFor="let quote of quotes"
      [quote]="quote"
      [tagSelected]="tagSelected"
      (onTagClick)="onTagSearch($event)"
      [@fadeInCard]>
    </app-quote-card>
  </div>

  <!-- Pagination Controls -->
  <div class="pagination" [@fadeIn]>
    <button
      mat-raised-button
      color="primary"
      (click)="changePage(-1)"
      [disabled]="requestForm.controls.page.value === '1' || (loading$ | async)">
      Previous
    </button>

    <span>Page {{ requestForm.controls.page.value }}</span>

    <button
      mat-raised-button
      color="primary"
      (click)="changePage(1)"
      [disabled]="quotes.length < 10 || (loading$ | async)">
      Next
    </button>
  </div>
</div>

<ng-template #noQuotes>
  <div class="quotes-container">
    <div class="empty-state">
      <svg width="120" height="120" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="#FFEB3B"/>
        <circle cx="9" cy="10" r="1.5" fill="#000"/>
        <circle cx="15" cy="10" r="1.5" fill="#000"/>
        <path d="M8 16c1.333 1 3.667 1 5 0" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <p>No quotes available 😜</p>
    </div>
  </div>
</ng-template>

<div class="loading-overlay" *ngIf="loading$ | async">
  <mat-spinner diameter="60"></mat-spinner>
</div>
