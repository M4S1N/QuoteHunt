<div *ngIf="quotes$ | async as quotes" class="quotes-container" [@fadeInContainer]>
  <!-- Filter Section -->
  <mat-form-field appearance="outline">
    <mat-label>Filter by Tag</mat-label>
    <input 
      matInput
      placeholder="Enter tag" 
      [formControl]="requestForm.controls.tag">
  </mat-form-field>

  <button
    mat-raised-button
    color="primary"
    (click)="onTagSearch()"
    [disabled]="(loading$ | async)">
    Search
  </button>

  <!-- Quotes Grid -->
  <div class="quotes-grid">
    <app-quote-card
      *ngFor="let quote of quotes"
      [quote]="quote"
      (onTagClick)="onTagSearch($event)"
      [@fadeInCard]>
    </app-quote-card>
  </div>

  <!-- Pagination Controls -->
  <div class="pagination" [@fadeIn]>
    <button
      mat-raised-button
      color="primary"
      (click)="changePage(-1)"
      [disabled]="requestForm.controls.page.value === '1' || (loading$ | async)">
      Previous
    </button>

    <span *ngIf="!(loading$ | async)">Page {{ requestForm.controls.page.value }}</span>

    <button
      mat-raised-button
      color="primary"
      (click)="changePage(1)"
      [disabled]="quotes.length < 10 || (loading$ | async)">
      Next
    </button>
  </div>
</div>
